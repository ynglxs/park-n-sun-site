<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Veinage du bouleau, en fond de page. SVG autonome : la couleur est celle du token
       --color-grain (oklch(55% 0.06 60)), en hex car le fichier est indépendant du CSS. -->
  <filter id="v" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.09" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.549  0 0 0 0 0.412  0 0 0 0 0.306  0 0 0 1.6 -0.62"/>
  </filter>
  <rect width="480" height="480" filter="url(#v)"/>
</svg>
